name: Feature Request
description: Suggest an idea or enhancement for the CLI, web app, API, or core engine.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for StackDoctor? Please share your feature request! If you are proposing a specific diagnostic rule, use the [New Rule Proposal form](new_rule_proposal.yml) instead.
  - type: input
    id: summary
    attributes:
      label: Feature Summary
      placeholder: "e.g. Add support for pnpm-workspace.yaml dependency hoisting"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds you've evaluated.
