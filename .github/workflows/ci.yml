name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, Lint, Typecheck, Test, and Eval (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Setup Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: npm ci

      - name: Secret Scan
        run: npm run check:secrets

      - name: License Audit
        run: npm run check:licenses

      - name: Build Monorepo
        run: npm run build

      - name: Run Linter
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        run: npm test

      - name: Run Diagnostic Accuracy Evaluation
        run: npm run eval

      - name: Run AI Safety Evaluation
        run: npm run eval:ai

      - name: Run Package Inspection
        run: npm run check:pack

      - name: Run Fresh Install Verification
        run: npm run test:install

      - name: Upload License Documentation Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: license-report-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: docs/licenses.md
          retention-days: 7
